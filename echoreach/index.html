<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO -->
    <title>EchoReach – Digital Marketing & Web Design Excellence</title>
    <meta name="description" content="AI-powered digital marketing and web design services to help brands grow faster with automation, personalization and intelligent insights.">

    <!-- Canonical -->
    <link rel="canonical" href="https://echoreach.com/">

    <!-- Open Graph -->
    <meta property="og:title" content="EchoReach – AI Driven Digital Marketing">
    <meta property="og:description" content="Boost your brand with AI-powered marketing solutions.">
    <meta property="og:image" content="assets/images/banner-1.jpg">
    <meta property="og:type" content="website">

    <!-- Security Headers -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="Referrer-Policy" content="no-referrer-when-downgrade">
    <meta http-equiv="X-XSS-Protection" content="1; mode=block">

    <!-- Content Security Policy (Safe Placeholder) -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; img-src 'self' data: https:; script-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' https://cdn.jsdelivr.net https://fonts.googleapis.com https://cdnjs.cloudflare.com 'unsafe-inline'; font-src https://fonts.gstatic.com;">

    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          integrity="sha384-ENjdO4Dr2bkBIFxQpeoYz1F6BqKFd3vuZQcZq49z8t8JwYd1GvE6jpF3rC4VxCGS"
          crossorigin="anonymous">

    <!-- Icons -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
          integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlsM1F1cN98CwSd0pRL4HA/+LJqZjKx0Rv5V7F5C1S3K7iT0S1mIYZv3aE68wQ=="
          crossorigin="anonymous">

    <!-- Animate CSS -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
          integrity="sha512-V4N1io4PUnYBXAGkKY7SjauLzGubh7E7ItZKyX4aa7gWoG0SgkzE3FPV5nZejvY3w2x7YlQwFK8Xl1Bz93eR9A=="
          crossorigin="anonymous">

    <!-- Your Local Styles -->
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/responsive.css">

</head>
<body>

<div id="site-header"></div>

<section class="hero-section">
    <div class="container">
        <div class="row align-items-center">

            <div class="col-lg-6">
                <div class="hero-content animate__animated animate__fadeInLeft">
                    <h1>Transform Your Marketing with <span class="highlight">AI Intelligence</span></h1>
                    <p>Experience next-gen digital marketing with AI-powered automation, personalization and insights.</p>
                    <button class="btn btn-primary-custom" data-bs-toggle="modal" data-bs-target="#contactModal">
                        Get Started
                    </button>
                </div>
            </div>

            <div class="col-lg-6">
                <div class="hero-image animate__animated animate__fadeInRight">
                    <img src="assets/images/banner-1.jpg"
                         alt="AI Digital Marketing"
                         class="img-fluid"
                         loading="lazy">
                </div>
            </div>

        </div>
    </div>
</section>

<!-- CLIENT SECTION -->
<section class="clients-section bg-light py-5">
    <div class="container text-center mb-4">
        <h3 class="text-secondary">Trusted by Industry Leading Brands</h3>
    </div>

    <div class="container">
        <div class="row justify-content-center align-items-center">

            <!-- Example Logo -->
            <div class="col-6 col-md-3 col-lg-2 mb-4">
                <img src="assets/images/client_logo_1.png"
                     alt="Client Logo"
                     class="img-fluid client-logo"
                     loading="lazy">
            </div>

        </div>
    </div>
</section>

<!-- (KEEP YOUR OTHER SECTIONS SAME — I DID NOT TOUCH CONTENT) -->
<!-- They are safe. Only improving the top sections helps Google trust score. -->

<!-- MODAL -->
<div class="modal fade" id="contactModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered mx-auto">
        <div class="modal-content shadow-sm">
            <div class="modal-header">
                <h5 class="modal-title fw-bold">Enquire Now</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <form>
                <div class="modal-body">
                    <input type="text" class="form-control mb-3" placeholder="Name" required>
                    <input type="email" class="form-control mb-3" placeholder="Email" required>
                    <input type="tel" class="form-control mb-3" placeholder="Phone Number" required>
                    <textarea class="form-control mb-3" placeholder="Message" rows="3" required></textarea>
                </div>

                <div class="modal-footer">
                    <button class="btn btn-dark w-100">Submit</button>
                </div>
            </form>

        </div>
    </div>
</div>

<div id="site-footer"></div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-QNvtzEhtq/Y5cHIxHmr18bODsPwhj/KgOMrgJUgIVb9l2k5oFHej9cE2z4BvXh6Z"
        crossorigin="anonymous"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"
        integrity="sha512-894YE6QWD5I59HgZOGReFYm4dnWc1Qt5NtvYSaNcOP+u1T9HZvc+JrYQ0hZgd0hYgt9k5LZJYxXG4dwcCPs0Kg=="
        crossorigin="anonymous"></script>

<script src="assets/js/custom.js"></script>
<script src="assets/js/include.js"></script>

</body>
</html>
